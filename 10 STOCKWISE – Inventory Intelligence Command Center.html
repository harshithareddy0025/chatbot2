<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STOCKWISE – Inventory Intelligence Command Center</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#667085;--bd:#e3e8f0;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--exc:#7c3aed;--soft:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e6ebf5;--mut:#93a0b8;--bd:#24304a;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--exc:#a78bfa;--soft:#1b2745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e6ebf5;--mut:#93a0b8;--bd:#24304a;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--exc:#a78bfa;--soft:#1b2745;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}

.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}

.chat{display:flex;flex-direction:column;height:540px}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}

.tool{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--soft);color:var(--ac);border:0;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
.row{display:flex;gap:8px}.row input{flex:1}

ul{padding-left:18px;margin:6px 0}p{margin:6px 0}
</style></head><body>
<header><h1>STOCKWISE · Inventory Intelligence Command Center<span>Demand forecasting · seasonality · safety stock · reorder and markdown decisions · simulated data · 28 Oct 2026 (week 43)</span></h1>
<button class="btn alt" id="th">Toggle theme</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),R=Math.round,mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))},sum=a=>a.reduce((x,y)=>x+y,0);
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const zf=p=>{const t=Math.sqrt(-2*Math.log(1-p));return t-(2.515517+.802853*t+.010328*t*t)/(1+1.432788*t+.189269*t*t+.001308*t**3)};
const season=(a,pk,w)=>1+a*Math.cos(2*Math.PI*(w-pk)/52),$$=v=>'$'+R(v).toLocaleString();
const SK=[
['S01','LED Festive Lights','Home',4,9,400,.01,.9,45,1800,0,21,5,500],['S02','Smartwatch FitX','Electronics',38,79,120,.02,.5,47,700,300,28,7,100],
['S03','Wireless Earbuds Pro','Electronics',22,55,260,.015,.4,47,1500,0,30,9,200],['S04','Winter Jacket Men','Apparel',18,60,90,0,.8,52,900,0,35,6,150],
['S05','Ceiling Fan 48in','Home',14,32,140,0,.7,20,3200,400,25,4,200],['S06','Air Cooler 40L','Home',40,85,60,0,.8,20,900,0,30,5,50],
['S07','Kids Rain Jacket','Apparel',6,18,80,0,.9,30,1400,0,20,4,200],['S08','Basmati Rice 5kg','Grocery',4.2,6.5,900,0,.15,44,4200,0,10,2,600],
['S09','Notebook 5-Pack','Stationery',1.5,3.5,500,0,.3,25,3000,0,14,3,500],['S10','Bluetooth Speaker Mini','Electronics',12,29,180,0,.45,46,650,0,24,6,100],
['S11','Gift Chocolate Box','Grocery',3,8,300,0,1,45,900,600,7,2,300],['S12','Yoga Mat','Sports',5,15,110,-.01,.2,2,2600,0,20,4,200]
].map(a=>({id:a[0],n:a[1],cat:a[2],c:a[3],p:a[4],b:a[5],tr:a[6],a:a[7],pk:a[8],oh:a[9],oo:a[10],lt:a[11],lv:a[12],moq:a[13]}));
const st={sl:95,sh:0,dl:0,hd:22,tab:'ov',sku:'S03',ok:{}};
const LBL={crit:'STOCKOUT RISK',high:'LOW STOCK',exc:'EXCESS',ok:'HEALTHY'},pill=s=>`<span class="pill ${s}">${LBL[s]}</span>`;
const CL={crit:'var(--bad)',high:'var(--warn)',exc:'var(--exc)',ok:'var(--ok)'};
function calc(){const z=zf(st.sl/100);const D=SK.map((s,i)=>{const r=rng(i*97+13),h=[];
 for(let w=18;w<=43;w++)h.push(R(s.b*(1+s.tr*(w-18))*season(s.a,s.pk,w)*(1+(r()+r()+r()-1.5)*.24)));
 const ds=h.map((y,j)=>y/season(s.a,s.pk,18+j)),x=ds.slice(-12),mx=mean(x);let nu=0,de=0;x.forEach((y,j)=>{nu+=(j-5.5)*(y-mx);de+=(j-5.5)**2});
 const sl=nu/de,lvl=mx+sl*5.5,sg=sd(x.map((y,j)=>y-(mx+sl*(j-5.5))));
 const f=[],sgk=[];for(let k=1;k<=8;k++){const se=season(s.a,s.pk,43+k);f.push(Math.max(0,R((lvl+sl*k)*se*(1+st.sh/100))));sgk.push(sg*se)}
 const LTw=(s.lt+st.dl)/7,fg=k=>f[Math.min(k,8)-1],cum=L=>{let t=0;for(let k=1;k<=Math.ceil(L);k++)t+=fg(k)*Math.min(1,L-k+1);return t};
 const DLT=cum(LTw),favg=DLT/LTw,sw=mean(sgk),SS=R(z*Math.sqrt(LTw*sw*sw+favg*favg*(s.lv/7)**2)),ROP=R(DLT+SS),tgt=R(ROP+f[0]),pos=s.oh+s.oo,f8=mean(f);
 const arr=Math.max(1,Math.ceil(LTw/2)),raw=[s.oh];for(let k=1;k<=8;k++)raw.push(raw[k-1]-f[k-1]+(k===arr?s.oo:0));
 const qty=pos<ROP?Math.ceil((tgt-pos)/s.moq)*s.moq:0,aw=Math.ceil(LTw),withO=raw.map((v,k)=>k>=aw?v+qty:v);
 const mn=Math.min(...raw),lost=Math.max(0,-mn),so=raw.findIndex(v=>v<0),cover=pos/Math.max(f8,1);
 const sv=lost>0?'crit':mn<SS?'high':cover>14?'exc':'ok',expd=so>=0&&so*7<s.lt+st.dl;
 const exU=sv==='exc'?Math.max(0,pos-10*f8):0,md=cover>26?35:cover>18?25:15;
 return {...s,h,f,sgk,sg,LTw,SS,ROP,tgt,pos,f8,raw,withO,qty,lost,so,cover,sv,expd,exU,md,exCap:exU*s.c,hold:exU*s.c*st.hd/100,lm:lost*(s.p-s.c),rev:mean(h)*52*s.p,cv:sd(x)/mx,mom:f8/mean(h.slice(-4))-1,cash:exU*s.p*(1-md/100)}});
 const t=sum(D.map(d=>d.rev));let c=0;[...D].sort((a,b)=>b.rev-a.rev).forEach(d=>{c+=d.rev;d.abc=c/t<=.7?'A':c/t<=.92?'B':'C'});D.forEach(d=>d.xyz=d.cv<.12?'X':d.cv<.22?'Y':'Z');return D}
function sc(){return `<div class="card"><h3>Scenario and policy controls</h3><div class="ctl"><label>Service level: <b>${st.sl}%</b><input type="range" min="85" max="99" value="${st.sl}" oninput="st.sl=+this.value;draw()"></label><label>Demand shock: <b>${st.sh>0?'+':''}${st.sh}%</b><input type="range" min="-30" max="50" value="${st.sh}" oninput="st.sh=+this.value;draw()"></label><label>Supplier delay: <b>+${st.dl} days</b><input type="range" min="0" max="21" value="${st.dl}" oninput="st.dl=+this.value;draw()"></label><label>Holding cost: <b>${st.hd}%/yr</b><input type="range" min="10" max="40" value="${st.hd}" oninput="st.hd=+this.value;draw()"></label><button class="btn alt" onclick="st.sl=95;st.sh=0;st.dl=0;st.hd=22;draw()">Reset</button></div></div>`}
function gauge(v){const c=v>=70?'var(--ok)':v>=45?'var(--warn)':'var(--bad)';return `<svg viewBox="0 0 160 100" width="100%" style="max-width:230px"><path d="M10 85 A70 70 0 0 1 150 85" fill="none" stroke="var(--bd)" stroke-width="14" stroke-linecap="round"/><path d="M10 85 A70 70 0 0 1 150 85" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${v*2.2} 300"/><text x="80" y="78" text-anchor="middle" font-size="30" font-weight="700" fill="var(--tx)">${v}</text><text x="80" y="95" text-anchor="middle" font-size="9" fill="var(--mut)">INVENTORY HEALTH / 100</text></svg>`}
function scatter(D){const W=640,H=320,X=c=>50+Math.min(c,30)/30*(W-70),Y=m=>H-30-(Math.max(-.6,Math.min(1.2,m))+.6)/1.8*(H-50);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><rect x="50" y="20" width="${X(8)-50}" height="${Y(0)-20}" fill="var(--bad)" opacity=".08"/><rect x="${X(14)}" y="${Y(0)}" width="${W-20-X(14)}" height="${H-30-Y(0)}" fill="var(--exc)" opacity=".1"/>
 <line x1="50" x2="${W-20}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--bd)"/><text x="54" y="34" font-size="10" fill="var(--bad)">Rising demand, thin stock</text><text x="${W-24}" y="${H-36}" text-anchor="end" font-size="10" fill="var(--exc)">Falling demand, heavy stock</text>
 <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--mut)">Weeks of cover (stock + on order) →</text><text x="12" y="${H/2}" font-size="10" fill="var(--mut)" transform="rotate(-90 12 ${H/2})">Demand momentum (next 8 wks vs last 4)</text>
 ${D.map(d=>`<g style="cursor:pointer" onclick="st.sku='${d.id}';st.tab='sku';draw()"><circle cx="${X(d.cover)}" cy="${Y(d.mom)}" r="${6+d.rev/4e5}" fill="${CL[d.sv]}" opacity=".85"/><text x="${X(d.cover)}" y="${Y(d.mom)-10}" text-anchor="middle" font-size="9" fill="var(--tx)">${d.id}</text></g>`).join('')}</svg>`}
function charts(d){const W=640,H1=210,H2=170,n=34,X=i=>40+i/(n-1)*(W-60),all=[...d.h,...d.f],mx=Math.max(...all,...d.f.map((v,k)=>v+1.64*d.sgk[k]))*1.1,Y=v=>H1-25-v/mx*(H1-40);
 const up=d.f.map((v,k)=>`${X(26+k)},${Y(v+1.64*d.sgk[k])}`),lo=d.f.map((v,k)=>`${X(26+k)},${Y(Math.max(0,v-1.64*d.sgk[k]))}`).reverse();
 const a=Math.max(...d.raw,...d.withO,d.ROP)*1.1,b=Math.min(0,...d.raw)*1.2,X2=k=>40+k/8*(W-60),Y2=v=>H2-22-(v-b)/(a-b)*(H2-35);
 return `<svg viewBox="0 0 ${W} ${H1}" width="100%"><polygon points="${up.concat(lo).join(' ')}" fill="var(--ac)" opacity=".15"/><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${d.h.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><polyline fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3" points="${[d.h[25],...d.f].map((v,i)=>X(25+i)+','+Y(v)).join(' ')}"/><line x1="${X(25.5)}" x2="${X(25.5)}" y1="8" y2="${H1-25}" stroke="var(--mut)" stroke-dasharray="2 3"/><text x="${X(25.5)-10}" y="${H1-8}" font-size="10" fill="var(--mut)">today</text><text x="44" y="14" font-size="10" fill="var(--mut)">Weekly units: history (blue), forecast with 90% band (orange)</text></svg>
 <svg viewBox="0 0 ${W} ${H2}" width="100%" style="margin-top:10px"><line x1="40" x2="${W-20}" y1="${Y2(0)}" y2="${Y2(0)}" stroke="var(--mut)"/><line x1="40" x2="${W-20}" y1="${Y2(d.ROP)}" y2="${Y2(d.ROP)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="44" y="${Y2(d.ROP)-4}" font-size="10" fill="var(--warn)">reorder point ${d.ROP}</text>
 <polyline fill="none" stroke="var(--bad)" stroke-width="2" points="${d.raw.map((v,k)=>X2(k)+','+Y2(v)).join(' ')}"/><polyline fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 3" points="${d.withO.map((v,k)=>X2(k)+','+Y2(v)).join(' ')}"/><text x="44" y="12" font-size="10" fill="var(--mut)">Projected stock (weeks 0–8): red = no action, green = with recommended order</text>${[0,2,4,6,8].map(k=>`<text x="${X2(k)-4}" y="${H2-6}" font-size="10" fill="var(--mut)">W${k}</text>`).join('')}</svg>`}
function alerts(D){const a=[];D.filter(d=>d.sv==='crit').forEach(d=>a.push(['crit',`<b>${d.n}</b> runs out in week ${d.so}, losing ~${R(d.lost).toLocaleString()} units (${$$(d.lm)} margin).${d.expd?' Lead time too long: expedite.':''}`]));D.filter(d=>d.sv==='high').forEach(d=>a.push(['high',`<b>${d.n}</b> dips below safety stock (${d.SS}).`]));D.filter(d=>d.sv==='exc').forEach(d=>a.push(['exc',`<b>${d.n}</b> has ${d.cover.toFixed(0)} weeks of cover; ${$$(d.exCap)} tied up in excess.`]));return a}
const T={
ov(D){const sc_=D.filter(d=>d.sv==='crit').length,lo=D.filter(d=>d.sv==='high').length,ex=D.filter(d=>d.sv==='exc').length,hs=R(100*(1-(sc_+lo*.5+ex*.7)/D.length)),turns=sum(D.map(d=>d.f8*52*d.c))/sum(D.map(d=>d.pos*d.c));
 return `${sc()}<div class="g k" style="margin-top:14px"><div class="card" style="text-align:center">${gauge(hs)}</div>
 <div class="card kpi"><small>Margin at risk (stockouts)</small><b style="color:var(--bad)">${$$(sum(D.map(d=>d.lm)))}</b><small>${sc_} SKUs, next 8 weeks</small></div>
 <div class="card kpi"><small>Capital in excess stock</small><b style="color:var(--exc)">${$$(sum(D.map(d=>d.exCap)))}</b><small>${ex} SKUs, ${$$(sum(D.map(d=>d.hold)))}/yr holding</small></div>
 <div class="card kpi"><small>Inventory turns</small><b>${turns.toFixed(1)}x</b><small>annualised on forecast</small></div></div>
 <div class="g c2" style="margin-top:14px"><div class="card"><h3>Inventory health matrix (click a dot)</h3>${scatter(D)}</div><div class="card"><h3>AI alert feed</h3><div class="feed">${alerts(D).map(a=>`<div>${pill(a[0])}<span>${a[1]}</span></div>`).join('')||'No alerts.'}</div></div></div>
 <div class="card" style="margin-top:14px"><h3>SKU overview</h3><div class="tw"><table><tr><th>SKU</th><th>Class</th><th>On hand</th><th>Wkly fcst</th><th>Cover (wks)</th><th>Lead time</th><th>Status</th></tr>${[...D].sort((a,b)=>'crit,high,exc,ok'.indexOf(a.sv)-'crit,high,exc,ok'.indexOf(b.sv)).map(d=>`<tr class="cl" onclick="st.sku='${d.id}';st.tab='sku';draw()"><td>${d.id} ${d.n}</td><td>${d.abc}${d.xyz}</td><td>${d.oh.toLocaleString()}</td><td>${R(d.f8).toLocaleString()}</td><td>${d.cover.toFixed(1)}</td><td>${d.lt+st.dl}d</td><td>${pill(d.sv)}</td></tr>`).join('')}</table></div></div>`},
sku(D){const d=D.find(x=>x.id===st.sku);return `${sc()}<div class="card" style="margin-top:14px"><div class="ctl"><label>SKU<select onchange="st.sku=this.value;draw()">${D.map(x=>`<option value="${x.id}" ${x.id===st.sku?'selected':''}>${x.id} ${x.n}</option>`).join('')}</select></label>${pill(d.sv)}<span>Class <b>${d.abc}${d.xyz}</b> · ${d.cat} · seasonal peak week ${d.pk}</span></div></div>
 <div class="g c2" style="margin-top:14px"><div class="card"><h3>Demand forecast and stock projection</h3>${charts(d)}</div><div class="card"><h3>Recommended decision</h3>
 <p><b>Reorder point:</b> ${d.ROP.toLocaleString()} units = lead-time demand ${(d.ROP-d.SS).toLocaleString()} + safety stock ${d.SS.toLocaleString()} (${st.sl}% service)</p><p><b>Order-up-to level:</b> ${d.tgt.toLocaleString()} · <b>Position:</b> ${d.pos.toLocaleString()} (${d.oh.toLocaleString()} on hand + ${d.oo.toLocaleString()} on order)</p>
 <p><b>Order now:</b> ${d.qty?`<b>${d.qty.toLocaleString()} units</b> (${d.qty/d.moq} × MOQ ${d.moq}), cost ${$$(d.qty*d.c)}`:'none'}${d.expd?'<br><span style="color:var(--bad)">Stock runs out before a normal order arrives. Expedite or split-ship.</span>':''}</p>
 ${d.sv==='exc'?`<p><b>Excess:</b> ${R(d.exU).toLocaleString()} units (${$$(d.exCap)}). Recommend <b>${d.md}% markdown</b>${d.oo?', cancel open PO':''}, redeploy to high-demand stores.</p>`:''}
 <p><b>Lost margin if no action:</b> ${$$(d.lm)} · <b>Forecast uncertainty (σ):</b> ±${R(d.sg*1.64)} units/wk · <b>Demand CV:</b> ${(d.cv*100).toFixed(0)}%</p></div></div>`},
ord(D){const P=D.filter(d=>d.qty>0).sort((a,b)=>b.lm-a.lm);return `${sc()}<div class="card" style="margin-top:14px"><h3>Recommended purchase orders · ${P.length}</h3><div class="tw"><table><tr><th>SKU</th><th>Position</th><th>ROP</th><th>Safety stock</th><th>Order qty</th><th>PO value</th><th>Margin protected</th><th>Note</th><th></th></tr>${P.map(d=>`<tr><td>${pill(d.sv)} ${d.n}</td><td>${d.pos.toLocaleString()}</td><td>${d.ROP.toLocaleString()}</td><td>${d.SS.toLocaleString()}</td><td><b>${d.qty.toLocaleString()}</b></td><td>${$$(d.qty*d.c)}</td><td>${$$(d.lm)}</td><td>${d.expd?'Expedite':'Standard lead'}</td><td><button class="btn ${st.ok['o'+d.id]?'done':''}" onclick="st.ok['o${d.id}']=!st.ok['o${d.id}'];draw()">${st.ok['o'+d.id]?'Approved ✓':'Approve'}</button></td></tr>`).join('')||'<tr><td>No orders needed.</td></tr>'}</table></div>
 <p>Approved: <b>${P.filter(d=>st.ok['o'+d.id]).length}</b> POs · <b>${$$(sum(P.filter(d=>st.ok['o'+d.id]).map(d=>d.qty*d.c)))}</b> committed</p><p style="color:var(--mut);font-size:12px">Safety stock = z × √(LT × σ² + d² × σLT²). Order-up-to = ROP + 1 week review demand, rounded to supplier MOQ.</p></div>`},
exc(D){const E=D.filter(d=>d.exU>0).sort((a,b)=>b.exCap-a.exCap);return `${sc()}<div class="card" style="margin-top:14px"><h3>Excess and slow-mover actions · ${E.length}</h3><div class="tw"><table><tr><th>SKU</th><th>Cover</th><th>Excess units</th><th>Capital tied</th><th>Holding/yr</th><th>Markdown</th><th>Cash recovered</th><th>Also</th><th></th></tr>${E.map(d=>`<tr><td>${d.n}</td><td>${d.cover.toFixed(0)} wks</td><td>${R(d.exU).toLocaleString()}</td><td>${$$(d.exCap)}</td><td>${$$(d.hold)}</td><td><b>${d.md}%</b></td><td>${$$(d.cash)}</td><td>${d.oo?'Cancel open PO':'Stop reorders'}</td><td><button class="btn ${st.ok['m'+d.id]?'done':''}" onclick="st.ok['m${d.id}']=!st.ok['m${d.id}'];draw()">${st.ok['m'+d.id]?'Approved ✓':'Approve'}</button></td></tr>`).join('')||'<tr><td>No excess stock.</td></tr>'}</table></div>
 <p>Approved cash recovery: <b>${$$(sum(E.filter(d=>st.ok['m'+d.id]).map(d=>d.cash)))}</b> · holding cost saved <b>${$$(sum(E.filter(d=>st.ok['m'+d.id]).map(d=>d.hold)))}/yr</b></p><p style="color:var(--mut);font-size:12px">Excess = stock above 10 weeks of forecast demand where total cover exceeds 14 weeks. Markdown depth rises with cover. Freed cash can fund the stockout POs.</p></div>`},
ag(){return `<div class="g c2"><div class="card chat"><h3>AI Inventory Agent</h3><div class="msgs" id="msgs"></div><div class="chips">${['Give me an executive briefing','Which products will stock out?','What should I order now?','Which products are overstocked?','How can excess stock fund the orders?','Why is the earbuds forecast so high?','Set service level 98 and demand +20%','Approve all recommended orders'].map(c=>`<button class="chip" onclick="ask('${c}')">${c}</button>`).join('')}</div><div class="row"><input type="text" id="q" placeholder="Ask about SKUs, forecasts, orders, scenarios…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div>
 <div class="card"><h3>How the agent works</h3><ul><li><b>Learn:</b> 26 weeks of sales, deseasonalised with each SKU's seasonal index.</li><li><b>Forecast:</b> level + trend × seasonal factor for 8 weeks, with 90% uncertainty bands.</li><li><b>Protect:</b> safety stock from demand and lead-time variability at your target service level.</li><li><b>Decide:</b> order-up-to quantities, MOQ rounding, expedite flags, markdown and PO cancellation.</li><li><b>Balance:</b> frees cash from excess to fund stockout orders.</li><li><b>Simulate:</b> change service level, demand shock or supplier delay and see the decisions change.</li></ul><p style="color:var(--mut);font-size:12px">This demo agent is a rule-based reasoning engine over live dashboard state. In production an LLM would orchestrate the same tools (forecast_demand, calc_safety_stock, recommend_order, plan_markdown).</p></div></div>`},
br(){return `<div class="g c2"><div class="card"><h3>The problem, explained</h3><p>The retailer is wrong in both directions at once: popular products sell out (lost sales, unhappy customers) while slow movers pile up (cash locked in stock, storage cost, forced discounts). It happens because stock is set by gut feel or flat rules that ignore <b>seasonality</b> (festive items surge in autumn, fans collapse), <b>demand uncertainty</b>, and <b>supplier lead times</b> (a late order can't save you).</p><p><b>Goal:</b> an AI system that forecasts demand per product, sets the right safety stock and reorder points, and tells buyers what to order, expedite, mark down or cancel, shifting cash from dead stock to winners.</p><p><b>Example:</b> earbuds sell out in 3 weeks while the lead time is 4. Meanwhile, ceiling fans have 40 weeks of cover in October.</p></div>
 <div class="card"><h3>Analyst's solution blueprint</h3><ul><li><b>Data:</b> weekly sales, on-hand, on-order, price and cost, supplier lead time and variability, MOQ, promotions, calendar events.</li><li><b>Features:</b> seasonal index, trend, demand CV (XYZ), revenue rank (ABC), cover vs. lead time.</li><li><b>Models:</b> deseasonalised trend forecast (this demo); upgrade to Prophet, LightGBM or hierarchical forecasting with price and promo effects.</li><li><b>Policy:</b> (s, S) reorder logic with service-level safety stock; markdown via price elasticity.</li><li><b>KPIs:</b> fill rate, stockout days, inventory turns, weeks of cover, GMROI, excess capital, forecast accuracy (WAPE).</li><li><b>Assumptions:</b> all data is synthetic; 8-week horizon, 1-week review cycle, elasticity folded into markdown tiers.</li></ul></div></div>`}};
const tabs=[['ov','Overview'],['sku','SKU forecast'],['ord','Purchase orders'],['exc','Excess and markdown'],['ag','AI Agent'],['br','Brief']];let hist=[];
function draw(){const D=calc();$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${st.tab===k?'on':''}" onclick="st.tab='${k}';draw()">${l}</button>`).join('');$('#app').innerHTML=T[st.tab](D);
 if(st.tab==='ag'){const m=$('#msgs');if(!hist.length)hist.push(`<div class="m">Hi, I’m your inventory intelligence agent. Ask me what will stock out, what is overstocked, what to order, or run a what-if (for example “demand +20%” or “supplier delay 10 days”).</div>`);m.innerHTML=hist.join('');m.scrollTop=m.scrollHeight}}
function push(h){hist.push(h);const m=$('#msgs');if(m){m.insertAdjacentHTML('beforeend',h);m.scrollTop=m.scrollHeight}}
function ask(t){const i=$('#q');t=t||i.value.trim();if(!t)return;i.value='';push(`<div class="m u">${t.replace(/</g,'&lt;')}</div>`);push(`<div class="m" id="typ">Analysing demand and stock…</div>`);setTimeout(()=>{$('#typ')?.remove();hist.pop();push(reply(t.toLowerCase()))},600)}
function reply(q){let D=calc();const f=(t,b)=>`<div class="m"><div class="tool">⚙ ${t}</div>${b}</div>`,Ls=(a,fn)=>`<ul>${a.map(x=>`<li>${fn(x)}</li>`).join('')}</ul>`;
 const P=D.filter(d=>d.qty>0).sort((a,b)=>b.lm-a.lm),E=D.filter(d=>d.exU>0).sort((a,b)=>b.exCap-a.exCap),C=D.filter(d=>d.sv==='crit');
 if(/service level|demand\s*[+-]|delay|reset|shock|surge|set /.test(q)&&!/why/.test(q)){const b={m:sum(D.map(d=>d.lm)),n:P.length},o={...st};
  const sl=q.match(/service level\D*(\d{2})/),dm=q.match(/demand\s*([+-]?\d+)/),dl=q.match(/delay\D*(\d+)/);
  if(/reset/.test(q)){st.sl=95;st.sh=0;st.dl=0}if(sl)st.sl=Math.min(99,Math.max(85,+sl[1]));if(dm)st.sh=Math.max(-30,Math.min(50,+dm[1]));if(dl)st.dl=Math.min(21,+dl[1]);
  D=calc();const P2=D.filter(d=>d.qty>0);return f('simulate_scenario → recompute_policy',`Scenario: service level <b>${st.sl}%</b>, demand <b>${st.sh>0?'+':''}${st.sh}%</b>, supplier delay <b>+${st.dl}d</b>.<ul><li>Margin at risk: ${$$(b.m)} → <b>${$$(sum(D.map(d=>d.lm)))}</b></li><li>POs recommended: ${b.n} → <b>${P2.length}</b></li><li>Stockout-risk SKUs: ${C.length} → <b>${D.filter(d=>d.sv==='crit').length}</b></li></ul>Controls on the dashboard are updated.`)}
 if(/approve/.test(q)){P.forEach(d=>st.ok['o'+d.id]=true);return f('create_purchase_orders',P.length?`Approved <b>${P.length}</b> POs worth <b>${$$(sum(P.map(d=>d.qty*d.c)))}</b>: ${P.map(d=>d.n).join(', ')}.`:'No orders to approve.')}
 const ws=q.replace(/[^a-z0-9 ]/g,'').split(' ').filter(w=>w.length>2),sk=D.map(d=>({d,s:ws.filter(w=>d.n.toLowerCase().includes(w)||d.id.toLowerCase()===w).length})).sort((a,b)=>b.s-a.s)[0];
 if(sk.s>0&&/why|forecast|detail|about|how|season|status/.test(q)){const d=sk.d,se=d.f8/Math.max(mean(d.h.slice(-4)),1);return f('forecast_demand → explain',`<b>${d.n}</b> (${d.abc}${d.xyz}): forecast ${R(d.f8).toLocaleString()} units/wk over the next 8 weeks, ${se>1?'up':'down'} <b>${R(Math.abs(se-1)*100)}%</b> vs. the last 4 weeks. Its seasonal peak is week ${d.pk} (amplitude ±${R(d.a*100)}%). Lead time ${d.lt+st.dl}d, cover ${d.cover.toFixed(1)} weeks, safety stock ${d.SS}.<br>${d.qty?`Order <b>${d.qty.toLocaleString()}</b> now${d.expd?' and expedite':''}.`:d.exU?`Excess of ${R(d.exU).toLocaleString()} units: mark down ${d.md}%.`:'No action needed.'}`)}
 if(/stock\s?out|run out|short|risk/.test(q))return f('project_stock',C.length?`Stockout risk:${Ls(C,d=>`<b>${d.n}</b>: out in week ${d.so}, ~${R(d.lost).toLocaleString()} units lost (${$$(d.lm)} margin)${d.expd?', expedite needed':''}`)}`:'No SKU is projected to stock out in 8 weeks.');
 if(/fund|cash|free|capital|swap/.test(q)){const cash=sum(E.map(d=>d.cash)),need=sum(P.map(d=>d.qty*d.c));return f('rebalance_cash',`Marking down excess stock recovers about <b>${$$(cash)}</b>. The recommended POs cost <b>${$$(need)}</b>, so excess liquidation covers <b>${need?R(cash/need*100):100}%</b> of the buy.`)}
 if(/over|excess|slow|markdown|dead/.test(q))return f('detect_excess',E.length?`Overstocked:${Ls(E,d=>`<b>${d.n}</b>: ${d.cover.toFixed(0)} weeks cover, ${$$(d.exCap)} tied up, mark down ${d.md}%${d.oo?', cancel open PO':''}`)}Total ${$$(sum(E.map(d=>d.exCap)))} in excess.`:'No excess detected.');
 if(/order|buy|reorder|purchase/.test(q))return f('recommend_order',P.length?`Order now:${Ls(P,d=>`<b>${d.n}</b>: ${d.qty.toLocaleString()} units (${$$(d.qty*d.c)})${d.expd?', expedite':''}`)}Approve them on the Purchase orders tab.`:'No orders needed.');
 if(/season|peak|festive/.test(q)){const s=[...D].sort((a,b)=>b.a-a.a).slice(0,4);return f('seasonality_index',`Most seasonal SKUs: ${Ls(s,d=>`<b>${d.n}</b>: ±${R(d.a*100)}% swing, peaks week ${d.pk}`)}`)}
 if(/brief|summary|overview|top|status/.test(q))return f('scan_inventory → synthesize',`${C.length} SKUs face stockouts (${$$(sum(D.map(d=>d.lm)))} margin at risk) while ${E.length} are overstocked (${$$(sum(D.map(d=>d.exCap)))} tied up). Seasonality is the driver: festive and winter lines are surging while summer lines are cold.${Ls(alerts(D).slice(0,3),a=>a[1])}Priority: place ${P.length} POs, then mark down excess to fund them.`);
 return f('help','Try: “executive briefing”, “which products will stock out”, “what should I order”, “which are overstocked”, “why is the earbuds forecast high”, “demand +20% and delay 10 days”.')}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark')||r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark'};
draw();
</script></body></html>
