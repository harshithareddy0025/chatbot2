<header><h1>NEXUS · Executive Decision Intelligence<span>KPI-to-financial driver analysis · evidence-based insights · simulated data (240 KPIs tracked, 14 modelled) · Nov 2023 – Oct 2026</span></h1>

const $=s=>document.querySelector(s),R=Math.round,sum=a=>a.reduce((x,y)=>x+y,0),mean=a=>sum(a)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};

['nps','NPS','Customer',42,6,'',1,0,0],['churn','Customer churn','Customer',2.1,.4,'%',-1,2,0],['resp','Ticket resolution time','Customer',9,2,'h',-1,1,0],
['otd','On-time delivery','Operations',91,3,'%',1,1,0],['yld','Production yield','Operations',94,1.5,'%',1,1,0],['invd','Inventory days','Operations',58,7,'d',-1,0,0],
['attr','Employee attrition','People',1.4,.35,'%',-1,2,0],['hc','Headcount','People',840,8,'',1,0,6]];
const ACT={win:'Run deal reviews and sales coaching on stalled late-stage deals',pipe:'Rebalance spend to high-converting channels and fix lead hand-off',deal:'Review discounting and bundle pricing',churn:'Launch proactive retention outreach to at-risk accounts',nps:'Close the loop on detractors within 48 hours',otd:'Clear logistics bottlenecks and expedite late orders',yld:'Root-cause scrap on the lowest-yield lines',invd:'Cut slow stock and tighten reorder points',cac:'Reallocate budget away from high-CAC channels',attr:'Targeted retention for critical roles',resp:'Add tier-1 support capacity',mql:'Monitor only: affects revenue indirectly via pipeline',traf:'Monitor only: no independent financial leverage',hc:'Monitor only: tracks growth, not performance'};

const n=36,lab=t=>new Date(2023,10+t,1).toLocaleString('en',{month:'short',year:'2-digit'});

function detr(a,se){const cols=t=>se?[1,t,Math.sin(2*Math.PI*t/12),Math.cos(2*Math.PI*t/12)]:[1,t],C=a.map((_,t)=>cols(t)),p=C[0].length,bt=solve(Array.from({length:p},(_,i)=>Array.from({length:p},(_,j)=>sum(C.map(r=>r[i]*r[j]))+(i===j?1e-9:0))),Array.from({length:p},(_,i)=>sum(C.map((r,t)=>r[i]*a[t])))),fit=t=>sum(cols(t).map((v,i)=>v*bt[i]));return {b:bt[1],fit,res:a.map((v,t)=>v-fit(t))}}
function solve(A,b){const m=b.length;A=A.map((r,i)=>[...r,b[i]]);for(let i=0;i<m;i++){let p=i;for(let j=i+1;j<m;j++)if(Math.abs(A[j][i])>Math.abs(A[p][i]))p=j;[A[i],A[p]]=[A[p],A[i]];for(let j=i+1;j<m;j++){const f=A[j][i]/A[i][i];for(let c=i;c<=m;c++)A[j][c]-=f*A[i][c]}}const x=Array(m).fill(0);for(let i=m-1;i>=0;i--){let s=A[i][m];for(let j=i+1;j<m;j++)s-=A[i][j]*x[j];x[i]=s/A[i][i]}return x}
function ridge(X,y,l){const p=X[0].length;return solve(Array.from({length:p},(_,i)=>Array.from({length:p},(_,j)=>sum(X.map(r=>r[i]*r[j]))+(i===j?l:0))),Array.from({length:p},(_,i)=>sum(X.map((r,t)=>r[i]*y[t]))))}
function an(tk){const y=OUT[tk].v,dy=detr(y,1),ts=[...Array(n-3).keys()].map(i=>i+3),s=sd(ts.map(t=>dy.res[t]));
 const ks=K.map(k=>{const x=KV[k[0]],dx=detr(x),sx=sd(dx.res),zx=dx.res.map(v=>v/sx);let best=0,bc=0;for(let l=0;l<=3;l++){const c=corr(ts.map(t=>zx[t-l]),ts.map(t=>dy.res[t]));if(Math.abs(c)>Math.abs(bc)){bc=c;best=l}}return {id:k[0],k,lag:best,zx,sx,naive:corr(x,y),dc:bc}});
 let X,be;const Y=ts.map(t=>dy.res[t]/s),pr=(x,b)=>sum(x.map((v,i)=>v*b[i])),build=()=>{X=ts.map(t=>ks.map(o=>o.zx[t-o.lag]));be=ridge(X,Y,3)};build();
 for(let it=0;it<3;it++)ks.forEach((o,i)=>{const r=ts.map((t,q)=>Y[q]-sum(ks.map((p,j)=>j===i?0:be[j]*p.zx[t-p.lag])));let bl=o.lag,bc=0;for(let l=0;l<=3;l++){const c=corr(ts.map(t=>o.zx[t-l]),r);if(Math.abs(c)>Math.abs(bc)){bc=c;bl=l}}o.lag=bl;o.dc=bc;build()});
 let sse=0,cs=0,f=Math.ceil(ts.length/3);for(let q=0;q<3;q++){const te=ts.map((_,i)=>i).filter(i=>Math.floor(i/f)===q),tr=ts.map((_,i)=>i).filter(i=>Math.floor(i/f)!==q),b2=ridge(tr.map(i=>X[i]),tr.map(i=>Y[i]),3);te.forEach(i=>{sse+=(Y[i]-pr(X[i],b2))**2})}
 const sst=sum(Y.map(v=>v*v)),tb=sum(be.map(Math.abs));ks.forEach((o,i)=>{o.beta=be[i];o.imp=Math.abs(be[i])/tb;o.spur=Math.abs(o.naive)>.5&&o.imp<.07});

const PER={q:[[30,31,32],[33,34,35],'last quarter vs prior quarter'],y:[[21,22,23],[33,34,35],'last quarter vs same quarter last year'],m:[[34],[35],'last month vs prior month']};
function wf(tk,p){const A=AN[tk],[a,b]=PER[p],c=A.ks.map(o=>({o,v:o.beta*A.s*(mean(b.map(t=>o.zx[t-o.lag]))-mean(a.map(t=>o.zx[t-o.lag])))})),act=mean(b.map(t=>A.y[t]))-mean(a.map(t=>A.y[t])),tr=mean(b.map(A.dy.fit))-mean(a.map(A.dy.fit));return {c:c.sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)),act,tr,oth:act-tr-sum(c.map(x=>x.v)),from:mean(a.map(t=>A.y[t])),to:mean(b.map(t=>A.y[t]))}}

 res.push({t:`Revenue is ${w.act<0?'down':'up'} ${fm('rev',Math.abs(w.act))} (${(w.act/w.from*100).toFixed(1)}%) vs. the prior quarter`,b:top.length?`Largest drags: <b>${top.map(x=>x.o.k[1]+' ('+sg('rev',x.v)+')').join('</b> and <b>')}</b>${up?`; offset by ${up.o.k[1]} (${sg('rev',up.v)})`:''}.`:'No material drags this quarter.',e:`Ridge driver model on detrended data, cross-validated R² ${A.cv.toFixed(2)}`,c:cf});

 <div class="card" style="margin-top:14px"><h3>Red-flag KPIs this month</h3><div class="tw"><table><tr><th>KPI</th><th>Dept</th><th>Now</th><th>Deviation</th><th>Financial relevance</th></tr>${alerts().map(a=>`<tr><td>${a.k[1]}</td><td>${a.k[2]}</td><td>${fk(a.k,KV[a.k[0]][n-1])}</td><td>${a.z.toFixed(1)}σ</td><td>${a.mi>=.08?pill('crit','MATERIAL'):pill('neu','NOISE')} ${(a.mi*100).toFixed(0)}%</td></tr>`).join('')||'<tr><td>No red flags.</td></tr>'}</table></div></div></div></div>`},
drv(){const tk=st.t,A=AN[tk];return `<div class="card"><h3>Correlation is not explanation · target: ${OUT[tk].n}</h3><p style="color:var(--mut)">Naive correlation uses raw levels. Driver importance removes trend and controls for all other KPIs at each KPI's best lead time. Spurious KPIs are flagged.</p><div class="tw"><table><tr><th>KPI</th><th>Dept</th><th>Naive corr.</th><th>Leads outcome by</th><th>Effect (per +1σ)</th><th>Driver importance</th><th>Verdict</th></tr>${[...A.ks].sort((a,b)=>b.imp-a.imp).map(o=>`<tr><td>${o.k[1]}</td><td>${o.k[2]}</td><td>${o.naive.toFixed(2)}</td><td>${o.lag?o.lag+' mo':'same month'}</td><td style="color:${cc(o.beta)}">${sg(tk,o.beta*A.s)}</td><td><div style="display:flex;gap:6px;align-items:center"><div class="bar"><i style="width:${o.imp*100*2.2}%;background:${cc(o.beta)}"></i></div>${(o.imp*100).toFixed(0)}%</div></td><td>${o.spur?pill('crit','SPURIOUS'):o.imp>=.08?pill('ok','DRIVER'):o.imp>=.04?pill('high','MINOR'):pill('neu','NOISE')}</td></tr>`).join('')}</table></div>
 <p style="color:var(--mut);font-size:12px">Model: ridge regression on detrended, standardised KPIs. In-sample R² ${A.r2.toFixed(2)}; 3-fold blocked cross-validated R² ${A.cv.toFixed(2)} (${conf(A)[1].toLowerCase()}). Association is not proof of causation: validate with experiments.</p></div>`},
chg(){const tk=st.t,w=wf(tk,st.per),ex=w.c.slice(0,7);return `<div class="card"><div class="ctl"><label>Compare<select onchange="st.per=this.value;draw()">${Object.entries(PER).map(([k,v])=>`<option value="${k}" ${k===st.per?'selected':''}>${v[2]}</option>`).join('')}</select></label><div><b>${OUT[tk].n}</b>: ${fm(tk,w.from)} → ${fm(tk,w.to)} (<b style="color:${cc(w.act)}">${sg(tk,w.act)}</b>)</div></div></div>
 <div class="card" style="margin-top:14px"><h3>What explains the change?</h3>${divbars([...ex.map(x=>({name:x.o.k[1]+' ('+x.o.k[2]+')',v:x.v,lbl:sg(tk,x.v)})),{name:'Trend and seasonality',v:w.tr,lbl:sg(tk,w.tr)},{name:'Unexplained',v:w.oth,lbl:sg(tk,w.oth)}],tk,'v')}
 <p>Explained by KPIs: <b>${sg(tk,sum(w.c.map(x=>x.v)))}</b> of the ${sg(tk,w.act)} move (${Math.abs(sum(w.c.map(x=>x.v))/(w.act||1)*100).toFixed(0)}%). Each bar = driver weight × how far that KPI (at its lead time) moved between the two periods.</p></div>`},
map(){const ts=['rev','gm','eb'],cl=(b,t)=>{const m=Math.max(...AN[t].ks.map(o=>Math.abs(o.beta)));const a=Math.min(1,Math.abs(b)/m);return b>=0?`rgba(22,163,74,${.15+a*.85})`:`rgba(220,38,38,${.15+a*.85})`};return `<div class="card"><h3>KPI → financial outcome impact map (standardised driver weights)</h3><div class="tw"><table class="hm"><tr><th>KPI</th><th>Dept</th>${ts.map(t=>`<th style="text-align:center">${OUT[t].n}</th>`).join('')}<th>Recommended action</th></tr>${K.map((k,i)=>`<tr><td style="color:var(--tx);text-align:left">${k[1]}</td><td style="color:var(--mut);text-align:left;font-weight:400">${k[2]}</td>${ts.map(t=>{const o=AN[t].ks[i];return `<td style="background:${cl(o.beta,t)}">${o.spur?'⚠ ':''}${o.beta.toFixed(2)}</td>`}).join('')}<td style="color:var(--tx);text-align:left;font-weight:400">${ACT[k[0]]}</td></tr>`).join('')}</table></div><p style="color:var(--mut);font-size:12px">Each row shows which departmental KPI moves which financial line. Pale cells are noise. Leaders see where operations and finance actually connect.</p></div>`},
wif(){const tk=st.t,A=AN[tk],top=[...A.ks].sort((a,b)=>b.imp-a.imp).slice(0,6),eff=sum(top.map(o=>o.beta*(st.sc[o.id]||0)*A.s));return `<div class="card"><h3>What-if simulator · top 6 drivers of ${OUT[tk].n.toLowerCase()}</h3><div class="g c2">${top.map(o=>{const s=st.sc[o.id]||0;return `<label style="font-size:12px;color:var(--mut)">${o.k[1]}: <b style="color:var(--tx)">${s>=0?'+':'−'}${Math.abs(s*o.sx).toFixed(o.k[7]+1)}${o.k[5]}</b> (now ${fk(o.k,KV[o.id][n-1])})<input type="range" style="width:100%" min="-1.5" max="1.5" step=".1" value="${s}" oninput="st.sc['${o.id}']=+this.value;draw()"></label>`}).join('')}</div><button class="btn alt" onclick="st.sc={};draw()">Reset</button></div>
 <div class="card kpi" style="margin-top:14px"><small>Projected sustained impact on ${OUT[tk].n.toLowerCase()}</small><b style="color:${cc(eff)}">${sg(tk,eff)}${tk==='rev'?' / month':''}</b><small>${tk==='rev'?`≈ ${sg(tk,eff*12,1)} per year`:`≈ ${sg('rev',eff/100*mean(OUT.rev.v.slice(-3))*12,1)} EBITDA/GP per year at current revenue`} · ${conf(A)[1].toLowerCase()}</small></div><p style="color:var(--mut);font-size:12px">Effects materialise after each KPI's lead time. Ridge shrinkage makes estimates conservative; treat as directional.</p>`},
ag(){return `<div class="g c2"><div class="card chat"><h3>AI Decision Intelligence Agent</h3><div class="msgs" id="msgs"></div><div class="chips">${['Give me the board briefing','Why did revenue change?','Which KPIs actually matter for margin?','Which KPIs can we ignore?','What is the revenue outlook?','What if win rate improves 3 points?','What actions should we take?','Show evidence for churn'].map(c=>`<button class="chip" onclick="ask('${c}')">${c}</button>`).join('')}</div><div class="row"><input type="text" id="q" placeholder="Ask why, what matters, what if, what next…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div>
 <div class="card"><h3>How the agent works</h3><ul><li><b>Connect:</b> joins 14 operational KPIs from 5 departments with revenue, margin and EBITDA.</li><li><b>Test:</b> finds each KPI's lead time, removes shared trends, fits a regularised multi-driver model, cross-validates.</li><li><b>Explain:</b> decomposes any period-over-period change into KPI contributions.</li><li><b>Filter:</b> separates material drivers from spurious or noisy KPIs.</li><li><b>Advise:</b> forecasts early-warning outlook, simulates what-ifs, maps drivers to actions, and states its confidence.</li></ul><p style="color:var(--mut);font-size:12px">This demo agent is a rule-based engine that narrates real statistics computed in the page. In production an LLM would call the same tools (rank_drivers, explain_change, simulate, forecast) and write the narrative, with every claim tied to the evidence tool output.</p></div></div>`},
br(){return `<div class="g c2"><div class="card"><h3>The problem, explained</h3><p>Executives see hundreds of KPIs on dozens of dashboards: sales, marketing, support, operations, HR. When revenue or margin moves, nobody can say <b>which</b> indicators explain it. Many KPIs move together only because everything grows over time (web traffic, headcount), while the real drivers are lagged and hidden. So leaders chase noise, and miss the warning signs.</p><p><b>Goal:</b> a decision-intelligence system that links operational KPIs to financial results, proves which ones matter and how far ahead they warn, and uses an LLM to turn that evidence into plain-language insights and recommendations leaders can trust.</p><p><b>Example:</b> “Revenue is down 7%. Win rate and churn explain two thirds of it. Web traffic looks correlated but is a trend artifact. Act on retention and deal review, not marketing volume.”</p></div>
 <div class="card"><h3>Analyst's solution blueprint</h3><ul><li><b>Data layer:</b> KPI warehouse (monthly or weekly) from CRM, marketing, support, ERP and HRIS joined to the finance ledger.</li><li><b>Analytics:</b> lead–lag analysis, detrending, regularised regression (this demo), then Granger tests, SHAP on gradient boosting, and causal inference or experiments for high-stakes calls.</li><li><b>Insight engine:</b> variance decomposition, anomaly detection, forecast and what-if simulation.</li><li><b>LLM layer:</b> retrieval over computed evidence only; generates board narratives, answers questions, cites numbers, flags confidence and limits.</li><li><b>Guardrails:</b> no claim without evidence; show correlation vs. causation caveats; human sign-off.</li><li><b>KPIs for the system:</b> forecast error (WAPE), insight adoption, time-to-diagnosis, decisions improved.</li><li><b>Assumptions:</b> all data is synthetic with a known driver structure so you can verify the model finds it.</li></ul></div></div>`}};
const tabs=[['ov','Overview'],['drv','Driver analysis'],['chg','What changed'],['map','Impact map'],['wif','What-if'],['ag','AI Agent'],['br','Brief']];let hist=[];
function draw(){$('#tg').value=st.t;$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${st.tab===k?'on':''}" onclick="st.tab='${k}';draw()">${l}</button>`).join('');$('#app').innerHTML=T[st.tab]();
 if(st.tab==='ag'){const m=$('#msgs');if(!hist.length)hist.push(`<div class="m">Hello, I’m your decision intelligence agent. I connect KPIs to financial outcomes and tell you what is driving them, what to ignore, and what to do next. Every answer comes with evidence and a confidence level.</div>`);m.innerHTML=hist.join('');m.scrollTop=m.scrollHeight}}
function push(h){hist.push(h);const m=$('#msgs');if(m){m.insertAdjacentHTML('beforeend',h);m.scrollTop=m.scrollHeight}}
function ask(t){const i=$('#q');t=t||i.value.trim();if(!t)return;i.value='';push(`<div class="m u">${t.replace(/</g,'&lt;')}</div>`);push(`<div class="m" id="typ">Testing hypotheses against the data…</div>`);setTimeout(()=>{$('#typ')?.remove();hist.pop();push(reply(t.toLowerCase()))},700)}
function reply(q){const f=(t,b,A)=>`<div class="m"><div class="tool">⚙ ${t}</div>${b}${A?`<div style="margin-top:6px">${pill(...conf(A))} <small style="color:var(--mut)">CV R² ${A.cv.toFixed(2)}</small></div>`:''}</div>`,L=(a,fn)=>`<ul>${a.map(x=>`<li>${fn(x)}</li>`).join('')}</ul>`;
 if(/margin|gross/.test(q)&&!/ebitda/.test(q))st.t='gm';else if(/ebitda/.test(q))st.t='eb';else if(/revenue|sales growth/.test(q))st.t='rev';const tk=st.t,A=AN[tk],nm=OUT[tk].n.toLowerCase();
 const kid=Object.keys(ALI).find(k=>ALI[k].test(q)),o=kid&&A.ks.find(x=>x.id===kid);
 if(/what if|if .*(improve|increase|reduce|rise|fall|drop|\+|-)|simulat|scenario/.test(q)&&o){const m=q.match(/([+-]?\d+(\.\d+)?)/),neg=/reduce|drop|fall|decrease|lower|cut/.test(q),num=m?Math.abs(+m[1])*(neg||(m[1][0]==='-')?-1:1):o.sx,s=Math.max(-1.5,Math.min(1.5,num/o.sx)),e=o.beta*s*A.s;st.sc[o.id]=s;
  return f('simulate_driver',`If <b>${o.k[1]}</b> changes by <b>${num>=0?'+':'−'}${Math.abs(s*o.sx).toFixed(o.k[7]+1)}${o.k[5]}</b> (sustained, effect arrives after ~${o.lag||0} months), ${nm} moves about <b>${sg(tk,e)}${tk==='rev'?' per month':''}</b>${tk==='rev'?` (≈ ${sg(tk,e*12)} per year)`:''}.${o.imp<.05?' Note: this KPI has little real driver weight, so do not expect much.':''} Slider set on the What-if tab.`,A)}
 if(o&&/evidence|why|prove|show|about|detail/.test(q)&&!/change|fall|drop/.test(q))return f('driver_evidence',`<b>${o.k[1]}</b> vs. ${nm}:<ul><li>Naive correlation (raw): <b>${o.naive.toFixed(2)}</b></li><li>Partial correlation (trend and other KPIs removed) at its best lead (${o.lag} mo): <b>${o.dc.toFixed(2)}</b></li><li>Multi-driver effect: <b>${sg(tk,o.beta*A.s)}</b> per +1σ, share of explained movement <b>${(o.imp*100).toFixed(0)}%</b></li><li>Verdict: <b>${o.spur?'spurious (shared trend)':o.imp>=.08?'real driver':o.imp>=.04?'minor':'noise'}</b></li></ul>Suggested action: ${ACT[o.id]}.`,A);
 if(/ignore|noise|spurious|vanity|distract|not matter/.test(q)){const s=A.ks.filter(x=>x.spur||x.imp<.04);return f('noise_filter',`Safe to deprioritise for ${nm}:${L(s,x=>`<b>${x.k[1]}</b>: naive corr ${x.naive.toFixed(2)}, driver weight ${(x.imp*100).toFixed(0)}%${x.spur?' (spurious: shared trend)':''}`)}`,A)}
 if(/matter|driver|important|explain|influence|key/.test(q)&&!/change|why did/.test(q)){const t=[...A.ks].sort((a,b)=>b.imp-a.imp).slice(0,5);return f('rank_drivers',`Top drivers of ${nm}:${L(t,x=>`<b>${x.k[1]}</b> (${x.k[2]}): ${(x.imp*100).toFixed(0)}% of movement, ${x.beta>0?'higher lifts':'higher lowers'} it, leads by ${x.lag||0} mo`)}`,A)}
 if(/why|change|fall|drop|decline|down|up|grew|increase/.test(q)||/revenue|margin|ebitda/.test(q)&&!/outlook|forecast|what if/.test(q)){const p=/year|yoy/.test(q)?'y':/month/.test(q)?'m':'q',w=wf(tk,p),ex=w.c.slice(0,4);return f('explain_change',`${OUT[tk].n}, ${PER[p][2]}: <b>${fm(tk,w.from)} → ${fm(tk,w.to)} (${sg(tk,w.act)})</b>.<br>Contributions:${L(ex,x=>`<b>${x.o.k[1]}</b>: ${sg(tk,x.v)}`)}KPIs explain <b>${sg(tk,sum(w.c.map(x=>x.v)))}</b>; the rest is trend and seasonality (${sg(tk,w.tr)}) and unexplained (${sg(tk,w.oth)}).`,A)}
 if(/outlook|forecast|next month|predict|expect|early/.test(q)){const x=fc(tk);return f('forecast_next_month',`Next month ${nm}: <b>${fm(tk,x.pred)}</b> vs. ${fm(tk,x.last)} now (trend-only ${fm(tk,x.base)}). The gap comes from lagged KPIs already moved: ${[...A.ks].filter(o=>o.lag>0).sort((a,b)=>b.imp-a.imp).slice(0,2).map(o=>o.k[1]).join(' and ')}.`,A)}
 if(/action|recommend|do|fix|priority/.test(q)){const w=wf(tk,'q'),neg=w.c.filter(x=>x.v<0).slice(0,3);return f('recommend_actions',neg.length?`Priority actions for ${nm}:${L(neg,x=>`<b>${x.o.k[1]}</b> (${sg(tk,x.v)}): ${ACT[x.o.id]}`)}`:'No material negative drivers; keep monitoring.',A)}
 if(/brief|summary|board|overview|status/.test(q)){const i=insights();return f('compose_briefing',`<b>Board briefing</b>${L(i,x=>`<b>${x.t}.</b> ${x.b}`)}`,AN.rev)}
 return f('help','Try: “board briefing”, “why did revenue change”, “which KPIs matter for margin”, “which KPIs can we ignore”, “revenue outlook”, “what if win rate +3”, “evidence for churn”.')}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark')||r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark'};
draw();
</script></body></html>
