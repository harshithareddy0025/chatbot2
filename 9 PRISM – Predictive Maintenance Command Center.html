<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PRISM – Predictive Maintenance Command Center</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14213d;--mut:#667085;--bd:#e3e8f0;--ac:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--soft:#eef2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e6ebf5;--mut:#93a0b8;--bd:#24304a;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:#1b2745;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e6ebf5;--mut:#93a0b8;--bd:#24304a;--ac:#5b8def;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--soft:#1b2745;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}h1 span{color:var(--mut);font-weight:400;font-size:12px;display:block}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px 0}nav button{border:0;background:none;color:var(--mut);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit;font-weight:600}
nav button.on{color:var(--ac);background:var(--card);box-shadow:inset 0 -2px var(--ac)}
main{padding:16px 20px 40px;max-width:1280px;margin:auto}
.g{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.c2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.c3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;min-width:0}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.kpi b{font-size:26px;display:block}.kpi small{color:var(--mut)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.crit{background:var(--bad)}.high{background:var(--warn)}.med{background:#ca8a04}.ok{background:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mut);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden;min-width:70px}.bar i{display:block;height:100%}
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:center}.ctl label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
select,input[type=text]{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600}.btn.alt{background:var(--soft);color:var(--ac)}.btn.done{background:var(--ok)}
.mc{cursor:pointer;transition:transform .15s}.mc:hover{transform:translateY(-2px)}
.chat{display:flex;flex-direction:column;height:520px}.msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px}
.m{max-width:88%;padding:10px 13px;border-radius:12px;background:var(--bg);border:1px solid var(--bd)}.m.u{align-self:flex-end;background:var(--ac);color:#fff;border:0}
.tool{font-size:11px;color:var(--mut);font-family:ui-monospace,monospace;margin-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:var(--soft);color:var(--ac);border:0;border-radius:99px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
.row{display:flex;gap:8px}.row input{flex:1}
.feed div{padding:8px 0;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:flex-start}
.hm td{text-align:center;color:#fff;font-weight:700}ul{padding-left:18px;margin:6px 0}p{margin:6px 0}
</style></head><body>
<header><h1>PRISM · Predictive Maintenance Command Center<span>Sensor analytics · failure patterns · maintenance planning · simulated data · 27 Oct 2026</span></h1>
<button class="btn alt" id="th">Toggle theme</button></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),cl=x=>Math.max(0,Math.min(100,x)),R=Math.round,mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const DAYS=['Tue 27','Wed 28','Thu 29','Fri 30','Sat 31','Sun 1','Mon 2'];
const M=[
{id:'M1',n:'CNC Lathe L-204',ln:'Line 1',age:6,pm:82,iv:90,f:1,hc:2400,fh:18,pmC:3500,rc:22000,seed:11,s:{v:[2,.065,.08,4.5],t:[60,.3,.6,80],c:[17,.04,.2,25]},ld:[85,90,70,60,95,40,30]},
{id:'M2',n:'Hydraulic Press H-11',ln:'Line 2',age:12,pm:40,iv:60,f:2,hc:3100,fh:24,pmC:4200,rc:31000,seed:22,s:{v:[3.2,.005,.1,5],t:[68,.4,.7,85],c:[22,.01,.2,30]},ld:[70,75,80,65,60,35,30]},
{id:'M3',n:'Conveyor C-3',ln:'Line 1',age:4,pm:30,iv:60,f:0,hc:1800,fh:8,pmC:900,rc:6000,seed:33,s:{v:[1.6,0,.08,4],t:[48,0,.5,70],c:[9,0,.15,14]},ld:[90,90,90,90,90,50,40]},
{id:'M4',n:'Air Compressor AC-7',ln:'Utilities',age:11,pm:70,iv:90,f:2,hc:2800,fh:20,pmC:2800,rc:26000,seed:44,s:{v:[2.5,.02,.08,5],t:[72,.7,.7,95],c:[31,.22,.3,42]},ld:[80,85,60,55,70,30,25]},
{id:'M5',n:'Injection Molder IM-5',ln:'Line 3',age:5,pm:25,iv:75,f:0,hc:2600,fh:14,pmC:3000,rc:18000,seed:55,s:{v:[2.2,0,.1,5],t:[64,0,.6,85],c:[27,0,.25,38]},ld:[75,80,85,80,70,45,35]},
{id:'M6',n:'Coolant Pump P-9',ln:'Utilities',age:9,pm:140,iv:120,f:0,hc:1500,fh:10,pmC:1200,rc:9000,seed:66,s:{v:[2.8,.04,.09,5.5],t:[55,.1,.5,70],c:[12,.01,.15,18]},ld:[60,65,60,55,50,30,20]},
{id:'M7',n:'Robot Arm R-2',ln:'Line 3',age:2,pm:20,iv:90,f:0,hc:2200,fh:12,pmC:2000,rc:15000,seed:77,s:{v:[1.2,0,.06,3],t:[45,0,.5,65],c:[8,0,.12,12]},ld:[85,85,90,85,80,50,40]},
{id:'M8',n:'Chiller CH-1',ln:'Utilities',age:8,pm:55,iv:90,f:1,hc:2000,fh:16,pmC:2400,rc:20000,seed:88,s:{v:[2.4,0,.08,5],t:[52,.02,.4,75],c:[24,.1,.3,32]},ld:[50,55,55,50,45,40,35]}];
const SN={v:['Vibration','mm/s'],t:['Temperature','°C'],c:['Motor current','A']};
const W=[['rul','Remaining life (RUL)'],['prox','Proximity to alarm limit'],['pm','Overdue maintenance'],['hist','Failure history'],['age','Asset age']];
const st={w:{rul:35,prox:20,pm:20,hist:15,age:10},h:0,tab:'ov',m:'M4',sn:'v',ok:{}};
const col=v=>v>=65?'var(--bad)':v>=45?'var(--warn)':v>=30?'#ca8a04':'var(--ok)';
const pill=s=>`<span class="pill ${s}">${{crit:'CRITICAL',high:'HIGH',med:'WATCH',ok:'HEALTHY'}[s]}</span>`;
const bar=v=>`<div class="bar"><i style="width:${v}%;background:${col(v)}"></i></div>`;
const PAT={bear:['Bearing wear / imbalance','Replace bearing set, re-lubricate and rebalance'],lub:['Lubrication loss / cooling degradation','Change oil and filter, clean heat exchanger'],therm:['Thermal overload','Flush cooling circuit, check hydraulic oil viscosity'],elec:['Motor load increase','Inspect windings and drive, check belt tension'],fric:['Misalignment / friction','Laser-align shaft, replace coupling'],pmd:['Overdue preventive maintenance','Perform scheduled PM service'],norm:['No degradation pattern','Continue condition monitoring']};
function calc(){return M.map(m=>{const r=rng(m.seed),sn={};
 for(const k of ['v','t','c']){const[s0,sl,nz,lim]=m.s[k],a=[];for(let i=0;i<30;i++)a.push(s0+sl*i+(r()+r()+r()-1.5)*2*nz);
  const x=a.slice(-14),my=mean(x);let nu=0,de=0;x.forEach((y,i)=>{nu+=(i-6.5)*(y-my);de+=(i-6.5)**2});const slope=nu/de,lat=mean(a.slice(-3)),lh=lat+slope*st.h,b=a.slice(0,18);
  sn[k]={a,slope,lat,lh,lim,rul:slope>.0005?Math.max(0,(lim-lh)/slope):99,z:(lh-mean(b))/Math.max(sd(b),.01),dr:slope*14/lim,ratio:lh/lim}}
 const rul=Math.min(60,...Object.values(sn).map(x=>x.rul)),prox=Math.max(...Object.values(sn).map(x=>x.ratio)),pr=(m.pm+st.h)/m.iv;
 const comps=[cl(100*(1-rul/30)),cl((prox-.5)*200),cl((pr-.6)*150),cl(m.f*20),cl(m.age*5)],w=Object.values(st.w),sw=w.reduce((a,b)=>a+b,0)||1;
 const score=R(comps.reduce((a,c,i)=>a+c*w[i],0)/sw),p=1/(1+Math.exp(-(score-55)/9)),sv=score>=65?'crit':score>=45?'high':score>=30?'med':'ok';
 const dv=sn.v.dr>.1,dt=sn.t.dr>.06,dc=sn.c.dr>.06,pk=dv&&dt?'fric':dt&&dc?'lub':dv?'bear':dt?'therm':dc?'elec':pr>1?'pmd':'norm';
 const cap=Math.min(6,Math.max(0,Math.floor(rul)-1));let best=0;for(let d=0;d<=cap;d++)if(m.ld[d]<m.ld[best])best=d;
 const imm=rul<1.5&&score>=30,fc=m.fh*m.hc+m.rc;
 return {...m,sn,rul,prox,pr,comps,score,p,sv,pk,pat:PAT[pk][0],act:PAT[pk][1],win:imm?-1:best,fc,avoid:p*fc,z:Math.max(...Object.values(sn).map(x=>x.z))}})}
const plan=D=>D.filter(m=>m.score>=30).sort((a,b)=>b.score-a.score);
function chart(m,k){const s=m.sn[k],a=s.a,lim=s.lim,N=44,W=640,H=230,mx=Math.max(lim*1.08,...a),mn=Math.min(...a)*.9,X=i=>40+i/(N-1)*(W-60),Y=v=>H-25-(v-mn)/(mx-mn)*(H-45);
 const pr=[];for(let i=0;i<=14;i++)pr.push(s.lat+s.slope*i);const hit=s.slope>.0005?(lim-s.lat)/s.slope:99;
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="40" x2="${W-20}" y1="${Y(lim)}" y2="${Y(lim)}" stroke="var(--bad)" stroke-dasharray="5 4"/><text x="44" y="${Y(lim)-4}" font-size="10" fill="var(--bad)">alarm limit ${lim}</text>
 <polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${a.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>
 <polyline fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4 3" points="${pr.map((v,i)=>X(29+i)+','+Y(Math.min(v,mx))).join(' ')}"/>
 <line x1="${X(29)}" x2="${X(29)}" y1="10" y2="${H-25}" stroke="var(--mut)" stroke-dasharray="2 3"/><text x="${X(29)-12}" y="${H-10}" font-size="10" fill="var(--mut)">today</text>
 ${st.h?`<line x1="${X(29+st.h)}" x2="${X(29+st.h)}" y1="10" y2="${H-25}" stroke="var(--warn)"/><text x="${X(29+st.h)-14}" y="${H-10}" font-size="10" fill="var(--warn)">+${st.h}d</text>`:''}
 ${hit<=14?`<circle cx="${X(29+hit)}" cy="${Y(lim)}" r="5" fill="var(--bad)"/><text x="${X(29+hit)-30}" y="${Y(lim)+16}" font-size="10" fill="var(--bad)">limit in ${hit.toFixed(1)}d</text>`:''}</svg>`}
function sp(a){const mn=Math.min(...a),mx=Math.max(...a)+.001;return `<svg width="90" height="26"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${a.filter((_,i)=>i%2==0).map((v,i)=>i*6+','+(24-(v-mn)/(mx-mn)*22)).join(' ')}"/></svg>`}
function gauge(v){return `<svg viewBox="0 0 160 100" width="100%" style="max-width:230px"><path d="M10 85 A70 70 0 0 1 150 85" fill="none" stroke="var(--bd)" stroke-width="14" stroke-linecap="round"/><path d="M10 85 A70 70 0 0 1 150 85" fill="none" stroke="${col(100-v)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${v*2.2} 300"/><text x="80" y="78" text-anchor="middle" font-size="30" font-weight="700" fill="var(--tx)">${v}</text><text x="80" y="95" text-anchor="middle" font-size="9" fill="var(--mut)">FLEET HEALTH / 100</text></svg>`}
const hz=()=>`<div class="card"><h3>Time-machine: what if we defer maintenance?</h3><div class="ctl"><label>Project forward: <b>+${st.h} days</b><input type="range" min="0" max="14" value="${st.h}" oninput="st.h=+this.value;draw()"></label><button class="btn alt" onclick="st.h=0;draw()">Back to today</button><span style="color:var(--mut);font-size:12px">Sensors drift along their fitted trend; maintenance clocks keep ticking.</span></div></div>`;
function alerts(D){return D.filter(m=>m.sv!=='ok').sort((a,b)=>b.score-a.score).map(m=>[m.sv,`<b>${m.n}</b>: ${m.pat}. ${m.rul<60?`Projected to breach an alarm limit in <b>${m.rul.toFixed(1)}d</b>`:'No limit breach in sight'}; 14-day failure probability ${R(m.p*100)}%.`])}
const T={
ov(D){const fh=R(100-mean(D.map(m=>m.score))),ar=D.filter(m=>m.sv==='crit'||m.sv==='high').length,dt=D.reduce((a,m)=>a+m.p*m.fh,0),pl=plan(D),net=pl.reduce((a,m)=>a+Math.max(0,m.avoid-m.pmC),0);
 return `${hz()}<div class="g k" style="margin-top:14px"><div class="card" style="text-align:center">${gauge(fh)}</div>
 <div class="card kpi"><small>Machines at risk</small><b style="color:var(--bad)">${ar}</b><small>of ${D.length} in critical/high</small></div>
 <div class="card kpi"><small>Expected downtime (14d)</small><b>${dt.toFixed(0)} h</b><small>if nothing is done</small></div>
 <div class="card kpi"><small>Net savings available</small><b style="color:var(--ok)">$${R(net/1000)}k</b><small>from preventive plan</small></div></div>
 <h3 style="margin:18px 0 8px;color:var(--mut);font-size:13px">MACHINE HEALTH</h3><div class="g c3">${[...D].sort((a,b)=>b.score-a.score).map(m=>`<div class="card mc" onclick="st.m='${m.id}';st.tab='mach';draw()"><div style="display:flex;justify-content:space-between"><b>${m.n}</b>${pill(m.sv)}</div><small style="color:var(--mut)">${m.ln} · ${m.pat}</small><div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0">${sp(m.sn.v.a)}<span>RUL <b>${m.rul>=60?'60+':m.rul.toFixed(1)}d</b></span></div>${bar(m.score)}<small style="color:var(--mut)">Risk ${m.score} · P(fail 14d) ${R(m.p*100)}%</small></div>`).join('')}</div>
 <div class="card" style="margin-top:14px"><h3>Early-warning alert feed</h3><div class="feed">${alerts(D).map(a=>`<div>${pill(a[0])}<span>${a[1]}</span></div>`).join('')||'No active alerts.'}</div></div>`},
mach(D){const m=D.find(x=>x.id===st.m);return `${hz()}<div class="card" style="margin-top:14px"><div class="ctl"><label>Machine<select onchange="st.m=this.value;draw()">${D.map(x=>`<option value="${x.id}" ${x.id===st.m?'selected':''}>${x.n}</option>`).join('')}</select></label><label>Sensor<select onchange="st.sn=this.value;draw()">${Object.entries(SN).map(([k,v])=>`<option value="${k}" ${k===st.sn?'selected':''}>${v[0]} (${v[1]})</option>`).join('')}</select></label>${pill(m.sv)}</div></div>
 <div class="g c2" style="margin-top:14px"><div class="card"><h3>${SN[st.sn][0]} · 30-day history + 14-day projection</h3>${chart(m,st.sn)}<p style="color:var(--mut);font-size:12px">Solid: readings. Dashed: trend extrapolation. Red dot: projected alarm-limit breach.</p></div>
 <div class="card"><h3>Diagnosis</h3><p><b>Pattern:</b> ${m.pat}</p><p><b>Recommended:</b> ${m.act}</p><p><b>RUL:</b> ${m.rul>=60?'60+':m.rul.toFixed(1)} days · <b>Risk:</b> ${m.score} · <b>P(fail 14d):</b> ${R(m.p*100)}%</p><p><b>Maintenance:</b> ${m.pm+st.h}d since last PM (interval ${m.iv}d) · ${m.f} failure(s) last 12 mo · ${m.age} yrs old</p><h3 style="margin-top:12px">Risk drivers</h3>${W.map((w,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:12px"><span style="width:170px">${w[1]}</span>${bar(m.comps[i])}<b>${R(m.comps[i])}</b></div>`).join('')}</div></div>
 <div class="card" style="margin-top:14px"><h3>Failure pattern detection across the fleet</h3><div class="tw"><table><tr><th>Machine</th><th>Vib drift</th><th>Temp drift</th><th>Current drift</th><th>Anomaly z</th><th>Detected pattern</th></tr>${D.map(x=>`<tr><td>${x.n}</td>${['v','t','c'].map(k=>`<td style="color:${x.sn[k].dr>(k==='v'?.1:.06)?'var(--bad)':'inherit'}">${(x.sn[k].dr*100).toFixed(1)}%</td>`).join('')}<td>${x.z.toFixed(1)}</td><td>${x.pat}</td></tr>`).join('')}</table></div></div>
 <div class="card" style="margin-top:14px"><h3>Risk model weights (live re-scoring)</h3><div class="ctl">${W.map(([k,l])=>`<label>${l}: <b>${st.w[k]}</b><input type="range" min="0" max="50" value="${st.w[k]}" oninput="st.w['${k}']=+this.value;draw()"></label>`).join('')}</div></div>`},
sch(D){const c=v=>v>=85?'var(--bad)':v>=60?'var(--warn)':'var(--ok)';return `<div class="card"><h3>Production load vs. recommended maintenance window</h3><div class="tw"><table class="hm"><tr><th>Machine</th>${DAYS.map(d=>`<th style="text-align:center">${d}</th>`).join('')}<th>Recommendation</th></tr>${D.map(m=>`<tr><td style="color:var(--tx);text-align:left">${m.n}</td>${m.ld.map((v,i)=>`<td style="background:${c(v)};${m.win===i&&m.score>=30?'outline:3px solid var(--tx);outline-offset:-3px':''}">${m.win===i&&m.score>=30?'🔧 ':''}${v}%</td>`).join('')}<td style="color:var(--tx);text-align:left">${m.score<30?'Not needed':m.win<0?'<b style="color:var(--bad)">Stop now: imminent failure</b>':`<b>${DAYS[m.win]}</b> (${m.ld[m.win]}% load)`}</td></tr>`).join('')}</table></div>
 <p style="color:var(--mut);font-size:12px">Green = low load, cheap to stop. The agent picks the lowest-load day that still falls before the predicted limit breach. 🔧 marks the window.</p></div>`},
plan(D){const P=plan(D),ap=P.filter(m=>st.ok[m.id]);return `<div class="card"><h3>AI preventive maintenance plan · ${P.length} work orders</h3><div class="tw"><table><tr><th>Machine</th><th>Pattern</th><th>Action</th><th>Window</th><th>PM cost</th><th>Failure cost</th><th>Net benefit</th><th></th></tr>${P.map(m=>`<tr><td>${pill(m.sv)} ${m.n}</td><td>${m.pat}</td><td>${m.act}</td><td>${m.win<0?'Immediate':DAYS[m.win]}</td><td>$${m.pmC.toLocaleString()}</td><td>$${R(m.avoid).toLocaleString()}</td><td style="color:${m.avoid>m.pmC?'var(--ok)':'var(--mut)'}">$${R(m.avoid-m.pmC).toLocaleString()}</td><td><button class="btn ${st.ok[m.id]?'done':''}" onclick="st.ok['${m.id}']=!st.ok['${m.id}'];draw()">${st.ok[m.id]?'Approved ✓':'Approve'}</button></td></tr>`).join('')||'<tr><td>No work orders needed.</td></tr>'}</table></div>
 <p>Approved: <b>${ap.length}</b> · spend <b>$${ap.reduce((a,m)=>a+m.pmC,0).toLocaleString()}</b> · expected loss avoided <b>$${R(ap.reduce((a,m)=>a+m.avoid,0)).toLocaleString()}</b> · downtime avoided <b>${ap.reduce((a,m)=>a+m.p*m.fh,0).toFixed(0)} h</b></p><p style="color:var(--mut);font-size:12px">Failure cost = P(fail) × (downtime hours × hourly loss + repair cost).</p></div>`},
ag(){return `<div class="g c2"><div class="card chat"><h3>AI Maintenance Agent</h3><div class="msgs" id="msgs"></div><div class="chips">${['Give me an executive briefing','Which machine fails first?','Why is the compressor risky?','When should we schedule maintenance?','What is the cost benefit?','What if we wait 7 days?','Approve critical work orders'].map(c=>`<button class="chip" onclick="ask('${c}')">${c}</button>`).join('')}</div><div class="row"><input type="text" id="q" placeholder="Ask about machines, patterns, schedules, costs…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div></div>
 <div class="card"><h3>How the agent works</h3><ul><li><b>Sense:</b> reads vibration, temperature and current streams plus maintenance logs.</li><li><b>Detect:</b> trend regression, z-score anomalies, signature matching for failure patterns.</li><li><b>Predict:</b> remaining useful life and 14-day failure probability.</li><li><b>Plan:</b> picks the lowest-load production window before the predicted breach.</li><li><b>Justify:</b> compares preventive cost with expected failure cost; human approves.</li></ul><p style="color:var(--mut);font-size:12px">This demo agent is a rule-based reasoning engine over live dashboard state. In production an LLM would orchestrate the same tools (get_sensor_trend, predict_rul, find_window, create_work_order).</p></div></div>`},
br(){return `<div class="g c2"><div class="card"><h3>The problem, explained</h3><p>Machines are fixed either <b>after</b> they break (reactive, expensive downtime) or on a <b>fixed calendar</b> (wasteful, and still misses surprises). Sensor data, maintenance logs and the production schedule live in separate places, so nobody connects “bearing vibration is climbing” with “Line 1 is fully loaded Friday”.</p><p><b>Goal:</b> an AI system that learns what failure looks like in the data, predicts <b>when</b> each machine will fail, and recommends <b>what</b> to fix and <b>when</b> to stop it at the least disruptive time.</p><p><b>Shift:</b> from “the press is down” to “the press needs an oil flush on Thursday, when load is 60%, to avoid a 24-hour stoppage.”</p></div>
 <div class="card"><h3>Analyst’s solution blueprint</h3><ul><li><b>Data:</b> vibration, temperature, current (1 reading/day here, minute-level in practice); PM history; failure logs; production schedule; downtime cost.</li><li><b>Features:</b> 14-day trend slope, z-score vs. healthy baseline, ratio to alarm limit, days since PM, age, past failures.</li><li><b>Models:</b> weighted risk score and linear RUL (this demo); upgrade to survival models or gradient boosting on labelled failures, plus LSTM/autoencoder anomaly detection.</li><li><b>Decision layer:</b> schedule-aware window finder and cost comparison.</li><li><b>KPIs:</b> unplanned downtime hours, MTBF, MTTR, maintenance cost per unit, OEE, prediction lead time.</li><li><b>Assumptions:</b> all data is synthetic; weights are adjustable on the Machines tab.</li></ul></div></div>`}};
const tabs=[['ov','Overview'],['mach','Machines'],['sch','Schedule'],['plan','Work orders'],['ag','AI Agent'],['br','Brief']];let hist=[];
function draw(){const D=calc();window.D=D;$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${st.tab===k?'on':''}" onclick="st.tab='${k}';draw()">${l}</button>`).join('');
 $('#app').innerHTML=T[st.tab](D);if(st.tab==='ag'){const m=$('#msgs');if(!hist.length)hist.push(`<div class="m">Hi, I’m your predictive maintenance agent. Ask me which machines will fail, why, when to service them, and what it costs. I can also fast-forward time and approve work orders.</div>`);m.innerHTML=hist.join('');m.scrollTop=m.scrollHeight}}
function push(h){hist.push(h);const m=$('#msgs');if(m){m.insertAdjacentHTML('beforeend',h);m.scrollTop=m.scrollHeight}}
function ask(t){const i=$('#q');t=t||i.value.trim();if(!t)return;i.value='';push(`<div class="m u">${t.replace(/</g,'&lt;')}</div>`);push(`<div class="m" id="typ">Analysing sensor streams…</div>`);setTimeout(()=>{$('#typ')?.remove();hist.pop();push(reply(t.toLowerCase()))},600)}
function reply(q){const D=calc(),f=(t,b)=>`<div class="m"><div class="tool">⚙ ${t}</div>${b}</div>`,top=[...D].sort((a,b)=>a.rul-b.rul),P=plan(D);
 const mm=D.find(m=>q.includes(m.id.toLowerCase())||m.n.toLowerCase().split(' ').some(w=>w.length>3&&q.includes(w.replace(/[^a-z]/g,''))&&!['line','robot'].includes(w))||(q.includes('compressor')&&m.id==='M4')||(q.includes('press')&&m.id==='M2'));
 if(/wait|defer|skip|forward|simulat|days later|reset|today/.test(q)){const b=calc();const n=/reset|today/.test(q)?0:+(q.match(/(\d+)\s*day/)||[0,7])[1];st.h=Math.min(14,n);const N=calc();return f('project_forward',`${n?`Projecting <b>+${st.h} days</b> with no maintenance:`:'Back to today.'}<ul><li>Machines at critical/high: ${b.filter(m=>m.score>=45).length} → <b>${N.filter(m=>m.score>=45).length}</b></li><li>Expected downtime (14d): ${b.reduce((a,m)=>a+m.p*m.fh,0).toFixed(0)}h → <b>${N.reduce((a,m)=>a+m.p*m.fh,0).toFixed(0)}h</b></li>${N.filter(m=>m.rul<1&&m.score>=30).map(m=>`<li><b>${m.n}</b> is projected to breach its alarm limit</li>`).join('')}</ul>`)}
 if(/approve/.test(q)){const c=P.filter(m=>m.sv==='crit'||m.sv==='high');c.forEach(m=>st.ok[m.id]=true);return f('create_work_orders',c.length?`Approved <b>${c.length}</b> work orders: ${c.map(m=>m.n).join(', ')}. Total spend $${c.reduce((a,m)=>a+m.pmC,0).toLocaleString()}. See the Work orders tab.`:'No critical or high-risk machines to approve.')}
 if(mm&&/why|risk|detail|about|status|compressor|press|lathe|cnc|pump|chiller|molder|conveyor|robot|m\d/.test(q)&&!/when|schedule|window/.test(q))return f('get_sensor_trend → diagnose',`<b>${mm.n}</b> (${mm.ln}): risk <b>${mm.score}</b>, ${pill(mm.sv)}<ul><li>Pattern: <b>${mm.pat}</b></li>${['v','t','c'].map(k=>`<li>${SN[k][0]}: ${mm.sn[k].lat.toFixed(1)} ${SN[k][1]}, drift ${(mm.sn[k].dr*100).toFixed(1)}% per 14d (limit ${mm.sn[k].lim})</li>`).join('')}<li>RUL ${mm.rul>=60?'60+':mm.rul.toFixed(1)}d · P(fail 14d) ${R(mm.p*100)}%</li></ul>Action: ${mm.act}.`);
 if(/when|schedule|window|plan/.test(q)){const l=P.slice(0,4);return f('find_maintenance_window',l.length?`<ul>${l.map(m=>`<li><b>${m.n}</b>: ${m.win<0?'<b>stop immediately</b>':`<b>${DAYS[m.win]}</b> at ${m.ld[m.win]}% load`} (breach in ${m.rul.toFixed(1)}d)</li>`).join('')}</ul>Windows are the lowest-load day before predicted breach.`:'No servicing needed in the next week.')}
 if(/cost|saving|benefit|roi|money/.test(q)){const n=P.reduce((a,m)=>a+Math.max(0,m.avoid-m.pmC),0);return f('compare_costs',`Doing the full plan costs <b>$${P.reduce((a,m)=>a+m.pmC,0).toLocaleString()}</b> and avoids roughly <b>$${R(P.reduce((a,m)=>a+m.avoid,0)).toLocaleString()}</b> of expected failure loss: net benefit ≈ <b>$${R(n).toLocaleString()}</b>. Biggest win: <b>${[...P].sort((a,b)=>(b.avoid-b.pmC)-(a.avoid-a.pmC))[0]?.n}</b>.`)}
 if(/first|fail|soon|next|predict|rul|life/.test(q))return f('predict_rul',`Shortest remaining life:<ul>${top.slice(0,3).map(m=>`<li><b>${m.n}</b>: ${m.rul.toFixed(1)} days, P(fail 14d) ${R(m.p*100)}%</li>`).join('')}</ul>`);
 if(/brief|summary|overview|top|status/.test(q)){const a=alerts(D).slice(0,3);return f('scan_fleet → synthesize',`Fleet health <b>${R(100-mean(D.map(m=>m.score)))}/100</b>, ${D.filter(m=>m.score>=45).length} machines at critical/high risk, expected downtime ${D.reduce((a,m)=>a+m.p*m.fh,0).toFixed(0)}h. Top signals:<ul>${a.map(x=>`<li>${x[1]}</li>`).join('')}</ul>Start with <b>${P[0]?.n||'routine monitoring'}</b>.`)}
 return f('help','Try: “executive briefing”, “which machine fails first”, “why is the compressor risky”, “when should we schedule maintenance”, “what if we wait 7 days”, “approve critical work orders”.')}
$('#th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).colorScheme.includes('dark')||r.dataset.theme==='dark';r.dataset.theme=d?'light':'dark'};
draw();
</script></body></html>
